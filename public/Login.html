<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>
    Gestión de Inventarios - Login
  </title>

  <link
    rel="stylesheet"
    href="assets/css/style.css"
  />

</head>

<body style="padding-bottom:140px;">

  <!-- CONTENIDO PRINCIPAL -->
  <div
    class="main-content"

    style="
      display:flex;
      width:100%;
      min-height:100vh;
    "
  >

    <!-- LOGO -->
    <div

      class="left-side"

      style="
        flex:1;
        display:flex;
        justify-content:center;
        align-items:center;
        padding-left:40px;
      "
    >

      <img

        src="assets/img/logo.jpg"

        alt="Logo Gestión de Inventarios"

        style="
          width:80%;
          max-width:550px;
          height:auto;
          object-fit:contain;
        "
      />

    </div>

    <!-- LOGIN -->
    <div

      class="right-side"

      style="
        flex:1;
        display:flex;
        justify-content:center;
        align-items:center;
        padding-right:40px;
      "
    >

      <div class="login-box">

        <h2>
          GESTOR DE INVENTARIOS
        </h2>

        <h3>
          INICIO DE SESIÓN
        </h3>

        <div class="form-group">

          <label for="email">
            Email
          </label>

          <input

            type="email"

            id="email"

            placeholder="Admin@correo.com"

            required
          />

        </div>

        <div class="form-group">

          <label for="password">
            Contraseña
          </label>

          <input

            type="password"

            id="password"

            placeholder="Introduce tu contraseña"

            required
          />

        </div>

        <button id="loginBtn">
          Iniciar sesión
        </button>

        <a

          id="registerLink"

          href="Registro.html"
        >
          ¿No tienes cuenta? Regístrate
        </a>

      </div>

    </div>

  </div>

  <!-- FOOTER -->
  <footer class="footer-global">

    <p>
      © 2026 Sistema Gestión de Inventarios.
      Todos los derechos reservados.
    </p>

    <p>
      Desarrollado por
      <strong>Jennyfer Díaz</strong>
      y
      <strong>John Carmona</strong>
    </p>

    <p>
      ✉️ jdiazp1@soy.sena.edu.co
      |
      jcarmonas6@soy.sena.edu.co
    </p>

    <p>
      Proyecto académico SENA
    </p>

  </footer>

  <script src="assets/js/login.js"></script>

  <script src="assets/js/backend-check.js"></script>

</body>

</html>
