<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestión de Inventarios - Clientes</title>
  <link rel="stylesheet" href="assets/css/style.css" />
<link rel="stylesheet" href="assets/css/pagination.css" />
</head>
<body>
  <div class="layout">
    <!-- Barra lateral -->
    <aside class="sidebar">
      <nav class="sidebar-menu">
        <ul>
          <li><a href="Dashboard.html" id="dashboardBtn">Dashboard</a></li>
          <li><a href="ModuloProductos.html" id="productosBtn">Productos</a></li>
          <li><a href="ModuloVentas.html" id="ventasBtn">Ventas</a></li>
          <li><a href="ModuloCliente.html" id="clientesBtn" class="active">Clientes</a></li>
          <li><a href="ModuloProveedor.html" id="proveedoresBtn">Proveedores</a></li>
          <li><a href="ModuloReportes.html" id="reportesBtn">Reportes</a></li>
          <li><a href="Login.html" id="logoutBtn">Cerrar Sesión</a></li>
        </ul>
      </nav>
    </aside>

    <!-- Contenido principal -->
    <main class="dashboard-container">
      <div class="topbar">
        <h1 class="topbar-title">GESTIÓN DE INVENTARIOS</h1>
        <span class="topbar-user">Usuario: <span id="topbarUser">Invitado</span></span>
      </div>

      <!-- Módulo de clientes -->
      <section id="clientes" class="productos-section">
        <div class="productos-header">
          <h2>Clientes</h2>
          <button id="btnNuevoCliente" class="nuevo-btn">NUEVO CLIENTE +</button>
        </div>

        <!-- Formulario para nuevo cliente -->
        <div id="formularioCliente" class="formulario-container" style="display: none;">
          <h3>Registrar nuevo cliente</h3>
          <form id="formCliente">
            <label for="nombreCliente">Nombre:</label>
            <input type="text" id="nombreCliente" required />

            <label for="emailCliente">Email:</label>
            <input type="email" id="emailCliente" required />

            <label for="telefonoCliente">Teléfono:</label>
            <input type="text" id="telefonoCliente" required />

            <label for="fechaRegistro">Fecha Registro:</label>
            <input type="date" id="fechaRegistro" required />

            
            <button type="submit">Guardar</button>
            <button type="button" id="cancelarCliente">Cancelar</button>
          </form>
        </div>

        <!-- Filtro de búsqueda -->
        <div class="filter-container">
          <input type="text" id="filtroClientes" placeholder="🔍 Buscar clientes..." style="width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 4px;" />
        </div>

        <!-- Tabla de clientes -->
        <table id="tablaClientes">
          <thead>
            <tr>
              <th>Id Cliente</th>
              <th>Nombre</th>
              <th>Email</th>
              <th>Teléfono</th>
              <th>Fecha Registro</th>
              <th>Total Pedidos</th>
              <th>Total Comprado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody>
            <!-- Las filas se agregarán dinámicamente -->
          </tbody>
        </table>
<div id="paginationClientes" class="pagination-container"></div>
      </section>
    </main>
  </div>

  <!-- Llamado al archivo JS externo -->
  <script src="assets/js/user-display.js"></script>
  <script src="assets/js/storage.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/backend-check.js"></script>
  <script src="assets/js/pagination.js"></script>
<script src="assets/js/ModuloCliente.js"></script>
</body>
</html>
