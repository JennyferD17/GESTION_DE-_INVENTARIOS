<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>
    Gestión de Inventarios - Productos
  </title>

  <link
    rel="stylesheet"
    href="assets/css/style.css"
  />

  <link
    rel="stylesheet"
    href="assets/css/pagination.css"
  />

</head>

<body>

  <div class="layout">

    <!-- ===================================== -->
    <!-- SIDEBAR -->
    <!-- ===================================== -->

    <aside class="sidebar">

      <nav class="sidebar-menu">

        <ul>

          <li>
            <a
              href="Dashboard.html"
              id="dashboardBtn"
            >
              Dashboard
            </a>
          </li>

          <li>
            <a
              href="ModuloProductos.html"
              id="productosBtn"
              class="active"
            >
              Productos
            </a>
          </li>

          <li>
            <a
              href="ModuloVentas.html"
              id="ventasBtn"
            >
              Ventas
            </a>
          </li>

          <li>
            <a
              href="ModuloCliente.html"
              id="clientesBtn"
            >
              Clientes
            </a>
          </li>

          <li>
            <a
              href="ModuloProveedor.html"
              id="proveedoresBtn"
            >
              Proveedores
            </a>
          </li>

          <li>
            <a
              href="ModuloReportes.html"
              id="reportesBtn"
            >
              Reportes
            </a>
          </li>

          <li>
            <a
              href="Login.html"
              id="logoutBtn"
            >
              Cerrar Sesión
            </a>
          </li>

        </ul>

      </nav>

    </aside>

    <!-- ===================================== -->
    <!-- CONTENIDO PRINCIPAL -->
    <!-- ===================================== -->

    <main class="dashboard-container">

      <!-- TOPBAR -->

      <div class="topbar">

        <h1 class="topbar-title">
          GESTIÓN DE INVENTARIOS
        </h1>

        <span class="topbar-user">

          Usuario:
          <span id="topbarUser">
            Invitado
          </span>

        </span>

      </div>

      <!-- ===================================== -->
      <!-- SECCIÓN PRODUCTOS -->
      <!-- ===================================== -->

      <section
        id="productos"
        class="productos-section"
      >

        <!-- HEADER -->

        <div class="productos-header">

          <h2>Productos</h2>

          <button
            id="btnNuevoProducto"
            class="nuevo-btn"
          >
            NUEVO PRODUCTO +
          </button>

        </div>

        <!-- ===================================== -->
        <!-- FORMULARIO -->
        <!-- ===================================== -->

        <div
          id="formularioProducto"
          class="formulario-container"
          style="display:none;"
        >

          <h3>
            Registrar nuevo producto
          </h3>

          <form id="formProducto">

            <!-- NOMBRE -->

            <label for="nombreProducto">
              Nombre:
            </label>

            <input
              type="text"
              id="nombreProducto"
              required
            />

            <!-- CATEGORÍA -->

            <label for="categoriaProducto">
              Categoría:
            </label>

            <input
              type="text"
              id="categoriaProducto"
              required
            />

            <!-- MARCA -->

            <label for="marcaProducto">
              Marca:
            </label>

            <input
              type="text"
              id="marcaProducto"
              required
            />

            <!-- PRECIO -->

            <label for="precioProducto">
              Precio:
            </label>

            <input
              type="number"
              id="precioProducto"
              required
            />

            <!-- STOCK -->

            <label for="stockProducto">
              Stock:
            </label>

            <input
              type="number"
              id="stockProducto"
              required
            />

            <!-- ================================= -->
<!-- PROVEEDOR -->
<!-- ================================= -->

<label for="proveedorProducto">
  Proveedor:
</label>

<div
  style="
    display:flex;
    gap:10px;
    align-items:center;
  "
>

  <select
    id="proveedorProducto"
    required
    style="
      flex:1;
      padding:10px;
    "
  >

    <option value="">
      Seleccione proveedor
    </option>

  </select>

  <button
    type="button"
    id="btnNuevoProveedorRapido"
    style="
      padding:10px 15px;
      background:#2563eb;
      color:white;
      border:none;
      border-radius:5px;
      cursor:pointer;
    "
  >
    + Nuevo
  </button>

</div>

<!-- ================================= -->
<!-- MODAL NUEVO PROVEEDOR -->
<!-- ================================= -->

<div
  id="modalProveedorRapido"
  style="
    display:none;
    background:#f8f9fa;
    border:1px solid #ccc;
    padding:20px;
    margin-top:15px;
    border-radius:10px;
  "
>

  <h3>
    Registrar nuevo proveedor
  </h3>

  <!-- NOMBRE -->
  <input
    type="text"
    id="nuevoProveedorNombre"
    placeholder="Nombre proveedor"
    style="
      width:100%;
      padding:10px;
      margin-bottom:10px;
    "
  />

  <!-- CONTACTO -->
  <input
    type="text"
    id="nuevoProveedorContacto"
    placeholder="Nombre contacto"
    style="
      width:100%;
      padding:10px;
      margin-bottom:10px;
    "
  />

  <!-- CORREO -->
  <input
    type="email"
    id="nuevoProveedorCorreo"
    placeholder="Correo"
    style="
      width:100%;
      padding:10px;
      margin-bottom:10px;
    "
  />

  <!-- TELÉFONO -->
  <input
    type="text"
    id="nuevoProveedorTelefono"
    placeholder="Teléfono"
    style="
      width:100%;
      padding:10px;
      margin-bottom:10px;
    "
  />

  <!-- DIRECCIÓN -->
  <input
    type="text"
    id="nuevoProveedorDireccion"
    placeholder="Dirección"
    style="
      width:100%;
      padding:10px;
      margin-bottom:15px;
    "
  />

  <!-- BOTONES -->
  <div
    style="
      display:flex;
      gap:10px;
    "
  >

    <button
      type="button"
      id="guardarProveedorRapido"
      style="
        padding:10px 15px;
        background:#16a34a;
        color:white;
        border:none;
        border-radius:5px;
        cursor:pointer;
      "
    >
      Guardar proveedor
    </button>

    <button
      type="button"
      id="cerrarModalProveedor"
      style="
        padding:10px 15px;
        background:#dc2626;
        color:white;
        border:none;
        border-radius:5px;
        cursor:pointer;
      "
    >
      Cancelar
    </button>

  </div>

</div>

            <!-- ESTADO -->

            <label for="estadoProducto">
              Estado:
            </label>

            <select
              id="estadoProducto"
              required
            >

              <option value="Disponible">
                Disponible
              </option>

              <option value="Agotado">
                Agotado
              </option>

            </select>

            <!-- BOTONES -->

            <button type="submit">
              Guardar
            </button>

            <button
              type="button"
              id="cancelarProducto"
            >
              Cancelar
            </button>

          </form>

        </div>

        <!-- ===================================== -->
        <!-- FILTRO -->
        <!-- ===================================== -->

        <div class="filter-container">

          <input
            type="text"
            id="filtroProductos"
            placeholder="🔍 Buscar productos..."
            style="
              width:100%;
              padding:10px;
              margin:10px 0;
              border:1px solid #ddd;
              border-radius:4px;
            "
          />

        </div>

        <!-- ===================================== -->
        <!-- TABLA -->
        <!-- ===================================== -->

        <table id="tablaProductos">

          <thead>

            <tr>

              <th>ID Producto</th>

              <th>Nombre</th>

              <th>Categoría</th>

              <th>Marca</th>

              <th>Precio</th>

              <th>Stock</th>

              <th>Proveedor</th>

              <th>Estado</th>

              <th>Acciones</th>

            </tr>

          </thead>

          <tbody></tbody>

        </table>

        <!-- PAGINACIÓN -->

        <div id="paginationControls"></div>

      </section>

    </main>

  </div>

  <!-- ===================================== -->
  <!-- SCRIPTS -->
  <!-- ===================================== -->

  <script src="assets/js/user-display.js"></script>

  <script src="assets/js/storage.js"></script>

  <script src="assets/js/ui.js"></script>

  <script src="assets/js/backend-check.js"></script>

  <script src="assets/js/pagination.js"></script>

  <script src="assets/js/ModuloProductos.js"></script>
   <script src="assets/js/footer.js"></script>

</body>

</html>
