<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestión de Inventarios - Ventas</title>
  <link rel="stylesheet" href="assets/css/style.css" />
<link rel="stylesheet" href="assets/css/pagination.css" />
</head>
<body>
  <div class="layout">
    <!-- Barra lateral -->
    <aside class="sidebar">
      <nav class="sidebar-menu">
        <ul>
          <li><a href="Dashboard.html" id="dashboardBtn">Dashboard</a></li>
          <li><a href="ModuloProductos.html" id="productosBtn">Productos</a></li>
          <li><a href="ModuloVentas.html" id="ventasBtn" class="active">Ventas</a></li>
          <li><a href="ModuloCliente.html" id="clientesBtn">Clientes</a></li>
          <li><a href="ModuloProveedor.html" id="proveedoresBtn">Proveedores</a></li>
          <li><a href="ModuloReportes.html" id="reportesBtn">Reportes</a></li>
          <li><a href="Login.html" id="logoutBtn">Cerrar Sesión</a></li>
        </ul>
      </nav>
    </aside>

    <!-- Contenido principal -->
    <main class="dashboard-container">
      <div class="topbar">
        <h1 class="topbar-title">GESTIÓN DE INVENTARIOS</h1>
        <span class="topbar-user">Usuario: <span id="topbarUser">Invitado</span></span>
      </div>

      <!-- Módulo de ventas -->
   
<section id="ventas" class="productos-section">

  <div class="productos-header">
    <h2>Ventas</h2>
    <button id="btnNuevaVenta" class="nuevo-btn">NUEVA VENTA +</button>
  </div>

  <!-- FORMULARIO -->
  <div id="formularioVenta" class="formulario-container" style="display: none;">

    <h3>Registrar nueva venta</h3>

    <form id="formVenta">

      <!-- CLIENTE -->
      <label>Cliente:</label>
      <input type="text" id="clienteVenta" placeholder="Nombre cliente" />

      <!-- FECHA -->
      <label>Fecha:</label>
      <input type="date" id="fechaVenta" />

      <!-- ESTADO -->
      <label>Estado:</label>
      <select id="estadoVenta">
        <option>Pendiente</option>
        <option>Pagado</option>
        <option>Cancelado</option>
      </select>

      <hr>

      <h4>Agregar Productos</h4>

      <div style="display:grid;grid-template-columns:1fr 1fr auto;gap:10px;">

        <!-- PRODUCTO ID -->
        <input type="text" id="idProducto" placeholder="ID producto">

        <!-- CANTIDAD -->
        <input type="number" id="cantidadProducto" value="1" min="1">

        <!-- BOTÓN -->
        <button type="button" id="btnAgregarProducto" class="nuevo-btn">
          Agregar
        </button>

      </div>

      <!-- TABLA CARRITO -->
      <div style="margin-top:15px;">
        <table style="width:100%">
          <thead>
            <tr>
              <th>Producto</th>
              <th>Cant</th>
              <th>Precio</th>
              <th>Subtotal</th>
              <th></th>
            </tr>
          </thead>

          <tbody id="listaProductosVenta"></tbody>
        </table>
      </div>

      <!-- TOTAL -->
      <label>Total:</label>
      <input type="number" id="totalVenta" readonly value="0">

      <!-- ADMIN -->
      <label>Administrador:</label>
      <input type="text" id="adminVenta" value="Pepito Perez">

      <button type="submit">Guardar Venta</button>
      <button type="button" id="cancelarVenta">Cancelar</button>

    </form>
  </div>

  <!-- TABLA VENTAS -->
  <table id="tablaVentas">
    <thead>
      <tr>
        <th>ID</th>
        <th>Cliente</th>
        <th>Fecha</th>
        <th>Total</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

</section>
