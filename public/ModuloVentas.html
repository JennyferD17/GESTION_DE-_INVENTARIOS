<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestión de Inventarios - Ventas</title>
  <link rel="stylesheet" href="assets/css/style.css" />
<link rel="stylesheet" href="assets/css/pagination.css" />
</head>
<body>
  <div class="layout">
    <!-- Barra lateral -->
    <aside class="sidebar">
      <nav class="sidebar-menu">
        <ul>
          <li><a href="Dashboard.html" id="dashboardBtn">Dashboard</a></li>
          <li><a href="ModuloProductos.html" id="productosBtn">Productos</a></li>
          <li><a href="ModuloVentas.html" id="ventasBtn" class="active">Ventas</a></li>
          <li><a href="ModuloCliente.html" id="clientesBtn">Clientes</a></li>
          <li><a href="ModuloProveedor.html" id="proveedoresBtn">Proveedores</a></li>
          <li><a href="ModuloReportes.html" id="reportesBtn">Reportes</a></li>
          <li><a href="Login.html" id="logoutBtn">Cerrar Sesión</a></li>
        </ul>
      </nav>
    </aside>

  <!-- MAIN -->
  <main class="dashboard-container">

    <!-- TOPBAR -->
    <div class="topbar">
      <h2>GESTIÓN DE VENTAS</h2>
      <span>Usuario: <b id="topbarUser">Invitado</b></span>
    </div>

    <!-- BOTÓN NUEVA VENTA -->
    <button id="btnNuevaVenta" class="nuevo-btn">➕ Nueva Venta</button>

    <!-- FORMULARIO -->
    <div id="formularioVenta" style="display:none; margin-top:20px;">

      <form id="formVenta">

        <h3>Nueva Venta</h3>

        <!-- CLIENTE -->
        <label>ID Cliente</label>
        <input type="text" id="idCliente" placeholder="ID cliente"/>

        <label>Cliente</label>
        <input type="text" id="clienteVenta" readonly/>

        <!-- FECHA -->
        <label>Fecha</label>
        <input type="date" id="fechaVenta"/>

        <!-- ESTADO -->
        <label>Estado</label>
        <select id="estadoVenta">
          <option value="Pendiente">Pendiente</option>
          <option value="Pagado">Pagado</option>
          <option value="Cancelado">Cancelado</option>
        </select>

        <hr>

        <div id="nuevoClienteBox" style="display:none; border:1px solid #ddd; padding:10px; margin-top:10px;">
  <h4>Crear cliente</h4>

  <input type="text" id="nuevoNombre" placeholder="Nombre">
  <input type="text" id="nuevoDoc" placeholder="Documento">
  <input type="text" id="nuevoEmail" placeholder="Email">
  <input type="text" id="nuevoTelefono" placeholder="Teléfono">

  <button type="button" id="guardarClienteRapido">Guardar Cliente</button>
</div>
        <!-- PRODUCTOS -->
        <h4>Productos</h4>

        <select id="idProducto"></select>
        <input type="number" id="cantidadProducto" value="1" min="1"/>

        <button type="button" id="btnAgregarProducto">Agregar</button>

        <!-- CARRITO -->
        <table border="1" width="100%">
          <thead>
            <tr>
              <th>Producto</th>
              <th>Cant</th>
              <th>Precio</th>
              <th>Subtotal</th>
              <th>Acción</th>
            </tr>
          </thead>
          <tbody id="listaProductosVenta"></tbody>
        </table>

        <br>

        <!-- TOTAL -->
        <label>Total</label>
        <input type="number" id="totalVenta" readonly/>

        <!-- ADMIN -->
        <label>Administrador</label>
        <input type="text" id="adminVenta" readonly/>

        <br><br>

        <button type="submit">Guardar Venta</button>
        <button type="button" id="cancelarVenta">Cancelar</button>

      </form>
    </div>

    <hr>

    <!-- BUSCAR -->
    <input type="text" id="filtroVentas" placeholder="Buscar ventas..."/>

    <!-- Tabla de ventas -->
        <table id="tablaVentas">
          <thead>
            <tr>
              <th>Id Pedido</th>
              <th>Cliente</th>
              <th>Fecha</th>
              <th>Estado</th>
              <th>Total</th>
              <th>Productos</th>
              <th>Administrador</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody>
            <!-- Las filas se agregarán dinámicamente -->
          </tbody>
        </table>
        <div id="paginationVentas" class="pagination-container"></div>

<!-- JS -->
<script src="assets/js/user-display.js"></script>
  <script src="assets/js/storage.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/backend-check.js"></script>
  <script src="assets/js/pagination.js"></script>
<script src="assets/js/ModuloVentas.js"></script>
     <script src="assets/js/footer.js"></script>

<script>
  // fecha automática
  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('fechaVenta').value =
      new Date().toISOString().split('T')[0];

    const user = JSON.parse(localStorage.getItem('usuarioActivo') || '{}');
    document.getElementById('topbarUser').textContent = user.nombre || 'Invitado';
  });
</script>

</body>
</html>
