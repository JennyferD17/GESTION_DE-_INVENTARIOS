
<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>
    Gestión de Inventarios - Login
  </title>

  <link
    rel="stylesheet"
    href="assets/css/style.css"
  />

</head>

<body>

  <!-- ================================= -->
  <!-- PANEL IZQUIERDO -->
  <!-- ================================= -->

  <div class="left-side">

    <img
      src="assets/img/logo.jpg"
      alt="Logo"
    />

  </div>

  <!-- ================================= -->
  <!-- LOGIN -->
  <!-- ================================= -->

  <div class="right-side">

    <div class="login-box">

      <h2>
        GESTOR DE INVENTARIOS
      </h2>

      <h3>
        INICIO DE SESIÓN
      </h3>

      <!-- EMAIL -->

      <div class="form-group">

        <label for="email">
          Correo
        </label>

        <input
          type="email"
          id="email"
          placeholder="admin@empresa.com"
          required
        />

      </div>

      <!-- PASSWORD -->

      <div class="form-group">

        <label for="password">
          Contraseña
        </label>

        <input
          type="password"
          id="password"
          placeholder="Ingrese contraseña"
          required
        />

      </div>

      <!-- MENSAJE -->

      <p id="mensajeLogin"></p>

      <!-- LOGIN -->

      <button id="loginBtn">

        Iniciar sesión

      </button>

      <!-- OLVIDE PASSWORD -->

      <a
        href="#"
        id="olvidePassword"
        style="
          display:block;
          margin-top:15px;
        "
      >

        ¿Olvidaste tu contraseña?

      </a>

    </div>

  </div>

  <!-- JS -->

  <script src="assets/js/login.js"></script>

</body>

</html>
